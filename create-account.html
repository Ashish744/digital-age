<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/pages.css"><title>Create Account — Stackly</title></head><body data-page="create-account"><div id="progress"></div><div id="cursor"></div>
<main class="auth"><div class="auth__art" aria-hidden="true"><img src="assets/images/photo-1522202176988-66273c2fd55f.webp" alt=""><div class="curtain"></div></div>
<div class="auth__form"><a class="logo" href="index.html"><img src="assets/logo/logo.webp" alt="Stackly home"></a><h1 class="h-lg">Join Stackly.</h1><p>Demo form: no account is actually created.</p><br>
<form data-validate novalidate><div class="formgrid">
<div class="field"><label for="fn">First name</label><input id="fn" data-rule="name" aria-describedby="fn-err"><div class="err" id="fn-err" role="alert"></div></div>
<div class="field"><label for="ln">Last name</label><input id="ln" data-rule="name" aria-describedby="ln-err"><div class="err" id="ln-err" role="alert"></div></div></div>
<div class="field"><label for="em">Email</label><input id="em" type="email" data-rule="email" aria-describedby="em-err"><div class="err" id="em-err" role="alert"></div></div>
<div class="field"><label for="pw">Password</label><div class="pw"><input id="pw" type="password" data-rule="password" aria-describedby="pw-err"><button type="button" data-toggle="pw">Show</button></div><div class="meter"><i id="meter"></i></div><small id="meter-t">Strength: —</small><div class="err" id="pw-err" role="alert"></div></div>
<div class="field"><label for="pw2">Confirm password</label><div class="pw"><input id="pw2" type="password" data-rule="confirm" aria-describedby="pw2-err"><button type="button" data-toggle="pw2">Show</button></div><div class="err" id="pw2-err" role="alert"></div></div>
<div class="field"><label><input id="tc" type="checkbox" data-rule="checked" style="width:auto" aria-describedby="tc-err"> I accept the <a href="#"><u>Terms</u></a></label><div class="err" id="tc-err" role="alert"></div></div>
<button class="btn btn--fill" type="submit">Create account</button><div class="status" role="status"></div></form><p style="margin-top:1rem">Have an account? <a href="login.html"><u>Login</u></a></p></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/main.js"></script><script src="js/navigation.js"></script><script src="js/validation.js"></script><script src="js/pages.js"></script></body></html>
