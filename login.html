<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/forms.css"><title>Login — Stackly</title></head><body><div id="progress"></div><div id="cursor"></div>
<main class="auth"><div class="auth__art" aria-hidden="true"><img src="assets/images/photo-1517245386807-bb43f82c33c4.webp" alt=""></div><div class="auth__form">
<a class="logo" href="index.html"><img src="assets/logo/logo.webp" alt="Stackly home"></a><h1 class="h-lg">Welcome back.</h1><p>Demo form: no real authentication is performed.</p><br>
<form data-validate novalidate>
<div class="field"><label for="acct">Login as</label><select id="acct"><option value="public">Public / Client</option><option value="admin">Admin</option></select></div>
<div class="field"><label for="email">Email</label><input id="email" type="email" data-rule="email" autocomplete="email" aria-describedby="email-err"><div class="err" id="email-err" role="alert"></div></div>
<div class="field"><label for="pw">Password</label><div class="pw"><input id="pw" type="password" data-rule="password" aria-describedby="pw-err"><button type="button" data-toggle="pw">Show</button></div><div class="err" id="pw-err" role="alert"></div></div>
<div class="field"><label><input type="checkbox" style="width:auto"> Remember me</label> · <a href="404.html">Forgot password?</a></div>
<button class="btn btn--fill" type="submit">Login</button><div class="status" role="status"></div></form></div></main>
<script src="js/navigation.js"></script><script src="js/validation.js"></script></body></html>
